command:
  ban:
    usage: '&#F1EE70Usage: $command [-s] <player> [time spec] [reason]'
    example: '&#F1EE70Example: $command Player 7d [reason]'
    silent_prefix: ''
    broadcast_ban: '&#E0E319[Staff] &8&l» &#E0E319$executor &fbanned &#E0E319$playerDisplayName
      &ffor ''&#E0E319$reason&f'''
    broadcast_tempban: '&#E0E319[Staff] &8&l» &#E0E319$executor &ftempbanned &#E0E319$playerDisplayName
      &ffor &#E0E319$tempDuration for ''&#E0E319$reason&f'''
    broadcast_ip_ban: '&#E0E319[Staff] &8&l» &#E0E319$executor &fIP-banned &#E0E319$playerDisplayName
