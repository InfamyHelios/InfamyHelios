      &#F1EE703) None of your user accounts are being randomly associated when checking /alts or /ipreport to view linked accounts on the same IP.
      &#F1EE704) If you have an offline-mode network or permit non-premium users to join, please add your authentication or lobby server to ignored_iphistory_servers to prevent falsely associated accounts (since anyone can join any account).
      &e// WARNING WARNING WARNING WARNING WARNING //
      &aIf you acknowledge and accept this disclaimer, please type &dlitebans accept&a to enable automatic bans.
